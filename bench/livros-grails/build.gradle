// A app de referência do benchmark (bench/livros/grails-app, pelo link simbólico) no Grails 8 de verdade.
// uso: ./gradlew -p bench/livros-grails bootJar   (docs/benchmark.md)
buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.grails.org/grails/restricted' }
    }
    dependencies {
        classpath platform("org.apache.grails:grails-hibernate7-bom:$grailsVersion")
        classpath 'org.apache.grails:grails-gradle-plugins'
        classpath 'org.apache.grails:grails-data-hibernate7'
    }
}

apply plugin: 'org.apache.grails.gradle.grails-web'
apply plugin: 'org.apache.grails.gradle.grails-gsp'

group = 'bench.livros'
version = '1.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.grails.org/grails/restricted' }
}

configurations.configureEach {
    exclude group: 'org.apache.grails', module: 'grails-data-hibernate5'
    exclude group: 'org.apache.grails.data', module: 'grails-data-hibernate5-core'
    exclude group: 'org.grails.plugins', module: 'hibernate5'
}

dependencies {
    profile 'org.apache.grails.profiles:web'
    implementation platform("org.apache.grails:grails-hibernate7-bom:$grailsVersion")
    implementation 'org.apache.grails:grails-core'
    implementation 'org.apache.grails:grails-data-hibernate7'
    implementation 'org.apache.grails:grails-databinding'
    implementation 'org.apache.grails:grails-events'
    implementation 'org.apache.grails:grails-gsp'
    implementation 'org.apache.grails:grails-interceptors'
    implementation 'org.apache.grails:grails-layout'
    implementation 'org.apache.grails:grails-logging'
    implementation 'org.apache.grails:grails-rest-transforms'
    implementation 'org.apache.grails:grails-services'
    implementation 'org.apache.grails:grails-sitemesh3'
    implementation 'org.apache.grails:grails-undertow'
    implementation 'org.apache.grails:grails-url-mappings'
    implementation 'org.apache.grails:grails-web-boot'
    implementation 'org.apache.grails:grails-converters'
    implementation 'org.apache.grails:grails-spring-security'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.zaxxer:HikariCP'
    runtimeOnly 'com.h2database:h2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
