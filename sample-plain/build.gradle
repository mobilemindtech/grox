// App mínima sem o layout grails-app/ nem o módulo Grails: core + gorm + gsp + security + rotas do grox-dsl,
// com views também em Pug e Markdown.
// É o teste de que o núcleo funciona sem Grails (docs/modularizacao.md, fase 4).
plugins {
    id 'groovy'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':framework:grox-core')
    implementation project(':framework:grox-gorm')
    implementation project(':framework:grox-gsp')
    implementation project(':framework:grox-security')
    implementation project(':framework:grox-dsl')
    implementation project(':framework:grox-pug')        // views .pug
    implementation project(':framework:grox-markdown')   // views .md e <md:render>
    runtimeOnly libs.slf4j.simple
    runtimeOnly libs.h2

    testImplementation libs.groovy.test.junit6
    testImplementation libs.groovy.http.builder   // cliente HTTP dos testes (groovy.http.HttpBuilder)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
    }
}

// handlers por anotação recebem os parâmetros pelo nome
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.parameters = true
}

application {
    mainClass = 'sample.plain.Aplicacao'
}

tasks.named('run') {
    systemProperty 'grox.env.default', 'development'
}

tasks.named('test') {
    useJUnitPlatform()
    // cada classe de teste sobe a própria aplicação (o GORM é global na JVM)
    forkEvery = 1
}
