/*
 * This file was generated by the Gradle 'init' task.
 *
 * The settings file is used to specify which projects to include in your build.
 * For more detailed information on multi-project builds, please refer to https://docs.gradle.org/9.8.0/userguide/multi_project_builds.html in the Gradle documentation.
 */

pluginManagement {
    // plugin org.grox.app (layout grails-app/ e pré-compilação de GSPs)
    includeBuild('gradle-plugin')
}

plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'grox'
include('framework', 'sample-lib', 'sample-app', 'sample-plain', 'bench', 'bench:livros')

// framework em módulos (docs/modularizacao.md); o projeto framework agrega todos
include('framework:grox-core', 'framework:grox-gorm', 'framework:grox-gsp', 'framework:grox-assets', 'framework:grox-security',
        'framework:grox-security-gorm', 'framework:grox-grails', 'framework:grox-grails-plugins', 'framework:grox-dsl',
        'framework:grox-pug', 'framework:grox-markdown')
